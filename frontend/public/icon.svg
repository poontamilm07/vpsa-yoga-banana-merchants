<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>
    <linearGradient id="bananaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background Rounded Shield -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Outer Gold Ring -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="#f59e0b" stroke-width="8" stroke-opacity="0.5"/>
  
  <!-- Main Icon Elements -->
  <g filter="url(#shadow)" transform="translate(256, 240) scale(1.6)">
    <!-- Banana Emoji / Graphic -->
    <text x="0" y="25" font-size="140" text-anchor="middle" dominant-baseline="central">🍌</text>
  </g>
  
  <!-- Ledger Badge Ribbon -->
  <rect x="96" y="380" width="320" height="64" rx="32" fill="#f59e0b"/>
  <text x="256" y="422" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#065f46" text-anchor="middle">BANANA LEDGER</text>
</svg>
