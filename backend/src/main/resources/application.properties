server.port=${PORT:8080}
spring.application.name=banana-ledger-backend

# Database Configuration (supports Production MySQL & local H2 fallback)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/bananaledger;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# H2 Console (enabled for local dev)
spring.h2.console.enabled=${SPRING_H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA / Hibernate DDL & Dialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# File Upload Configuration
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Application Security & Business Configuration
app.jwt.secret=${APP_JWT_SECRET:9a2f8c4e7b1d3a5f6e8c0b2d4f6a8c1e3b5d7f9a2c4e6b8d0f2a4c6e8b0d2f4a}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}
